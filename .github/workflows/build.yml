name: Build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/build_solana.sh'
      - 'scripts/devnet_smoke.sh'
      - 'scripts/local_validator_smoke.sh'
      - 'programs/rlya_sale/**'
      - 'Cargo.toml'
      - 'Anchor.toml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build_solana.sh

  devnet-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[devnet-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deploy disposable RLYA program to Devnet
        run: bash scripts/devnet_smoke.sh
