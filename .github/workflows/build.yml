name: Build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/build_solana.sh'
      - 'scripts/audit_source.py'
      - 'scripts/verify_mainnet_public.mjs'
      - 'scripts/mainnet_program_deploy.sh'
      - 'scripts/mainnet_program_deploy.ps1'
      - 'scripts/devnet_smoke.sh'
      - 'scripts/local_validator_smoke.sh'
      - 'programs/rlya_sale/**'
      - 'model/**'
      - 'tokenomics/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Anchor.toml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and audit Solana program
        run: bash scripts/build_solana.sh
      - name: Audit prelaunch financial invariants
        run: python3 scripts/audit_prelaunch.py
      - name: Audit live-copy safety
        run: python3 scripts/audit_site_copy.py
      - name: Install pinned web and function dependencies
        run: npm install --no-audit --no-fund
      - name: Test prelaunch economic invariants
        run: npm run test:prelaunch
      - name: Compile Netlify financial functions
        run: npm run build:functions
      - name: Build self-hosted production browser bundles
        run: npm run build:web

  local-integration:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[integration]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary Solana JS test dependencies
        run: npm install --prefix /tmp --no-save --no-package-lock --silent @solana/web3.js@1.98.4 @solana/spl-token@0.4.14
      - name: Run full RLYA localhost protocol integration
        run: bash scripts/local_validator_smoke.sh

  devnet-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[devnet-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable Devnet funding address
        run: bash scripts/devnet_smoke.sh prepare
      - name: Publish safe public funding address
        uses: actions/upload-artifact@v4
        with:
          name: rlya-devnet-funding-address-${{ github.run_id }}
          path: /tmp/ralya-devnet-address.txt
          retention-days: 1
      - name: Wait for Devnet funding and deploy RLYA program
        run: bash scripts/devnet_smoke.sh deploy
