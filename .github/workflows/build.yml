name: Build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/build_solana.sh'
      - 'scripts/devnet_smoke.sh'
      - 'scripts/local_validator_smoke.sh'
      - 'programs/rlya_sale/**'
      - 'Cargo.toml'
      - 'Anchor.toml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build_solana.sh

  local-integration:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[integration]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary Solana JS test dependencies
        run: npm install --prefix /tmp --no-save --no-package-lock --silent @solana/web3.js@1.98.4 @solana/spl-token@0.4.14
      - name: Run full RLYA localhost protocol integration
        run: bash scripts/local_validator_smoke.sh

  devnet-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[devnet-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable Devnet funding address
        run: bash scripts/devnet_smoke.sh prepare
      - name: Publish safe public funding address
        uses: actions/upload-artifact@v4
        with:
          name: rlya-devnet-funding-address-${{ github.run_id }}
          path: /tmp/ralya-devnet-address.txt
          retention-days: 1
      - name: Wait for Devnet funding and deploy RLYA program
        run: bash scripts/devnet_smoke.sh deploy

  devnet-protocol:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[devnet-protocol]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary Solana JS test dependencies
        run: npm install --prefix /tmp --no-save --no-package-lock --silent @solana/web3.js@1.98.4 @solana/spl-token@0.4.14
      - name: Prepare disposable Devnet protocol payer
        run: |
          cat > /tmp/rlya_devnet_prepare.mjs <<'JS'
          import fs from 'node:fs';
          import {Keypair} from '@solana/web3.js';
          const k=Keypair.generate();
          fs.writeFileSync('/tmp/rlya-devnet-protocol-payer.json',JSON.stringify(Array.from(k.secretKey)));
          fs.writeFileSync('/tmp/rlya-devnet-protocol-address.txt',k.publicKey.toBase58()+'\n');
          console.log('RALYA_DEVNET_PROTOCOL_PAYER='+k.publicKey.toBase58());
          JS
          node /tmp/rlya_devnet_prepare.mjs
      - name: Publish safe public protocol funding address
        uses: actions/upload-artifact@v4
        with:
          name: rlya-devnet-protocol-address-${{ github.run_id }}
          path: /tmp/rlya-devnet-protocol-address.txt
          retention-days: 1
      - name: Wait for Devnet funding and run paced public protocol smoke
        run: |
          cat > /tmp/rlya_devnet_wait.mjs <<'JS'
          import fs from 'node:fs';
          import {Connection,Keypair,LAMPORTS_PER_SOL} from '@solana/web3.js';
          const rpc='https://api.devnet.solana.com';
          const c=new Connection(rpc,'confirmed');
          const k=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync('/tmp/rlya-devnet-protocol-payer.json','utf8'))));
          let ok=false;
          for(let i=1;i<=120;i++){
            const sol=(await c.getBalance(k.publicKey,'confirmed'))/LAMPORTS_PER_SOL;
            console.log(`Devnet protocol funding check ${i}/120: ${sol} SOL`);
            if(sol>=0.25){ok=true;break;}
            await new Promise(r=>setTimeout(r,15000));
          }
          if(!ok) throw new Error('Devnet protocol payer was not funded to at least 0.25 SOL in time.');
          JS
          node /tmp/rlya_devnet_wait.mjs
          sleep 20
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('scripts/local_validator_smoke.sh').read_text()
          marker="cat > /tmp/ralya_local_integration.mjs <<'JS'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\nJS\n\nRALYA_PROGRAM_ID=",start)
          js=src[start:end]
          js=js.replace("const RPC='http://127.0.0.1:8899';","const RPC='https://api.devnet.solana.com';")
          js=js.replace("if(!RPC.includes('127.0.0.1')) throw new Error('Integration harness refuses non-local RPC');","if(RPC!=='https://api.devnet.solana.com') throw new Error('Devnet harness refuses any non-Devnet RPC');")
          js=js.replace("/tmp/ralya-local-payer.json","/tmp/rlya-devnet-protocol-payer.json")
          js,n=re.subn(r"const fundTx=new Transaction\(\);.*?\nawait sendAndConfirmTransaction\(c,fundTx,\[admin\]\);\n","",js,count=1,flags=re.S)
          if n!=1: raise SystemExit('Could not remove localhost-only wallet funding block')
          # Serialize and pace all HTTP JSON-RPC calls from the shared GitHub runner.
          needle="const c=new Connection(RPC,'confirmed');\n"
          throttle=r'''const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rawRpc=c._rpcRequest.bind(c);
let rpcTail=Promise.resolve();
c._rpcRequest=(method,args)=>{
  const task=rpcTail.then(async()=>{
    await sleep(1600);
    let last;
    for(let attempt=1;attempt<=8;attempt++){
      try{
        const res=await rawRpc(method,args);
        if(res?.error?.code===429) throw new Error('RPC 429');
        return res;
      }catch(e){
        last=e;
        if(attempt===8) throw e;
        await sleep(2000*attempt);
      }
    }
    throw last;
  });
  rpcTail=task.catch(()=>{});
  return task;
};
c.confirmTransaction=async(sigOrStrategy)=>{
  const sig=typeof sigOrStrategy==='string'?sigOrStrategy:sigOrStrategy.signature;
  for(let i=0;i<80;i++){
    const st=await c.getSignatureStatuses([sig],{searchTransactionHistory:true});
    const v=st.value[0];
    if(v){
      if(v.err) throw new Error('Transaction failed: '+JSON.stringify(v.err));
      if(v.confirmationStatus==='confirmed'||v.confirmationStatus==='finalized') return {context:st.context,value:{err:null}};
    }
    await sleep(1800);
  }
  throw new Error('Timed out waiting for Devnet transaction confirmation');
};
'''
          if needle not in js: raise SystemExit('Could not install Devnet RPC pacing')
          js=js.replace(needle,needle+throttle,1)
          # Public Devnet proves the core settlement path. Exhaustive abuse guards stay
          # on the already-green local validator to avoid hammering the shared RPC.
          cut="const [attRef]=PublicKey.findProgramAddressSync([referralSeed,attacker.publicKey.toBuffer()],PROGRAM_ID);"
          pos=js.index(cut)
          tail=r'''
const mint=await getMint(c,rlya);assert.equal(mint.supply,HARD);assert.equal(mint.mintAuthority,null);assert.equal(mint.freezeAuthority,null);
s=await getState(sale);assert.equal(s.raised,600n*U);assert.equal(s.refPaid,5n*U);assert.equal(s.sold,q+q2+man);assert.equal(s.manual,man);
console.log(JSON.stringify({status:'PASS',network:'devnet',programId:PROGRAM_ID.toBase58(),rlyaMint:rlya.toBase58(),usdcMint:usdc.toBase58(),sale:sale.toBase58(),totalSold:s.sold.toString(),grossUsdc:s.raised.toString(),referralUsdc:s.refPaid.toString(),priceMicroUsdc:price(s).toString(),guardCount}));
console.log('RALYA_DEVNET_PROTOCOL_INTEGRATION=PASS');
'''
          js=js[:pos]+tail
          Path('/tmp/rlya_devnet_protocol_integration.mjs').write_text(js)
          PY
          RALYA_PROGRAM_ID='Dk5eeCK6KmYY4b6pQkCRpfbZViwEjYJLryjZoUgBxsHN' node /tmp/rlya_devnet_protocol_integration.mjs | tee /tmp/rlya-devnet-protocol.log
          grep -F 'RALYA_DEVNET_PROTOCOL_INTEGRATION=PASS' /tmp/rlya-devnet-protocol.log
