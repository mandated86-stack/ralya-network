name: Build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/build_solana.sh'
      - 'scripts/devnet_smoke.sh'
      - 'scripts/local_validator_smoke.sh'
      - 'programs/rlya_sale/**'
      - 'Cargo.toml'
      - 'Anchor.toml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build_solana.sh

  local-integration:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[integration]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary Solana JS test dependencies
        run: npm install --prefix /tmp --no-save --no-package-lock --silent @solana/web3.js@1.98.4 @solana/spl-token@0.4.14
      - name: Run full RLYA localhost protocol integration
        run: bash scripts/local_validator_smoke.sh

  devnet-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[devnet-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable Devnet funding address
        run: bash scripts/devnet_smoke.sh prepare
      - name: Publish safe public funding address
        uses: actions/upload-artifact@v4
        with:
          name: rlya-devnet-funding-address-${{ github.run_id }}
          path: /tmp/ralya-devnet-address.txt
          retention-days: 1
      - name: Wait for Devnet funding and deploy RLYA program
        run: bash scripts/devnet_smoke.sh deploy
