name: Repository checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check.yml'
      - 'Makefile'
      - 'programs/**'
      - 'model/**'
      - 'tokenomics/**'
      - 'tests/**'
      - 'scripts/stress_live_sale.py'
      - 'scripts/audit_source.py'
      - 'scripts/audit_prelaunch.py'
      - 'scripts/build_solana.sh'
      - 'scripts/mainnet_program_deploy.sh'
      - 'scripts/mainnet_program_deploy.ps1'
      - 'scripts/verify_mainnet_public.mjs'
      - 'Anchor.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/check.yml'
      - 'Makefile'
      - 'programs/**'
      - 'model/**'
      - 'tokenomics/**'
      - 'tests/**'
      - 'scripts/stress_live_sale.py'
      - 'scripts/audit_source.py'
      - 'scripts/audit_prelaunch.py'
      - 'scripts/build_solana.sh'
      - 'scripts/mainnet_program_deploy.sh'
      - 'scripts/mainnet_program_deploy.ps1'
      - 'scripts/verify_mainnet_public.mjs'
      - 'Anchor.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository
        run: make verify
      - name: Verify Mainnet owner tooling syntax
        run: |
          bash -n scripts/mainnet_program_deploy.sh
          node --check scripts/verify_mainnet_public.mjs
          node --check web/site-config.js
          node --check web/owner/launch.js
          node --check web/owner/atomic-launch.js
          node --check web/owner/smoke.js
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw 'scripts/mainnet_program_deploy.ps1')) | Out-Null"
