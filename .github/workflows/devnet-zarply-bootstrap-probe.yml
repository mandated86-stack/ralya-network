name: Devnet ZARPLY Bootstrap Probe
on:
  push:
    paths:
      - '.github/workflows/devnet-zarply-bootstrap-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install web3
        run: npm install --prefix /tmp --no-save --no-package-lock --silent @solana/web3.js@1.98.4
      - name: Request API faucet and verify SOL gas
        run: |
          cat > /tmp/probe.mjs <<'JS'
          import {Keypair,Connection} from '@solana/web3.js';
          const k=Keypair.generate();
          const address=k.publicKey.toBase58();
          console.log('ZARPLY_TEST_ADDRESS='+address);
          const r=await fetch('https://faucet.zarply.co.za/api/faucet',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pubkey:address})});
          const text=await r.text();
          console.log('ZARPLY_HTTP='+r.status);
          console.log('ZARPLY_BODY='+text.slice(0,1000));
          const c=new Connection('https://docs-demo.solana-devnet.quiknode.pro/','confirmed');
          for(let i=0;i<60;i++){
            const b=await c.getBalance(k.publicKey,'confirmed');
            if(b>=5000){console.log('ZARPLY_BOOTSTRAP=PASS balance='+b);process.exit(0)}
            await new Promise(r=>setTimeout(r,1000));
          }
          throw new Error('ZARPLY did not provide at least 5000 lamports');
          JS
          node /tmp/probe.mjs
