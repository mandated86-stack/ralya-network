name: Pin rpc-websockets dependency
on:
  push:
    branches:
      - fix/pin-rpc-websockets-2026-08-16
permissions:
  contents: write
jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh lockfile with pinned rpc-websockets
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const lock=require('./package-lock.json');
          const rpc=lock.packages['node_modules/rpc-websockets'];
          const nested=lock.packages['node_modules/rpc-websockets/node_modules/uuid'];
          if (!rpc || rpc.version !== '9.1.3') throw new Error(`rpc-websockets pin failed: ${rpc?.version}`);
          if (nested && Number(String(nested.version).split('.')[0]) >= 12) throw new Error(`ESM-only nested uuid remains: ${nested.version}`);
          console.log(`RPC_WEBSOCKETS=${rpc.version}`);
          console.log(`NESTED_UUID=${nested?.version || 'deduped'}`);
          NODE
      - name: Verify full release build
        run: |
          npm ci --no-audit --no-fund
          npm run test:prelaunch
          npm run build:functions
          npm run build:web
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --check
          git commit -m 'Lock rpc-websockets 9.1.3 for Netlify runtime'
          git push
