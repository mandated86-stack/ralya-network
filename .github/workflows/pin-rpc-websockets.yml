name: Pin rpc-websockets dependency
on:
  push:
    branches:
      - fix/pin-rpc-websockets-2026-08-16
permissions:
  contents: write
jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh lockfile with pinned rpc-websockets
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const lock=require('./package-lock.json');
          const entries=Object.entries(lock.packages).filter(([k])=>k.includes('rpc-websockets'));
          console.log(entries.map(([k,v])=>`${k}=${v.version}`).join('\n'));
          const rpcEntries=entries.filter(([k])=>/node_modules\/rpc-websockets$/.test(k));
          if (!rpcEntries.length) throw new Error('No rpc-websockets lock entry found');
          for (const [k,v] of rpcEntries) if (v.version !== '9.1.3') throw new Error(`rpc-websockets pin failed at ${k}: ${v.version}`);
          const badUuid=Object.entries(lock.packages).filter(([k,v])=>k.includes('rpc-websockets/node_modules/uuid') && Number(String(v.version).split('.')[0])>=12);
          if (badUuid.length) throw new Error(`ESM-only nested uuid remains: ${badUuid.map(([k,v])=>`${k}=${v.version}`).join(', ')}`);
          console.log('RPC_WEBSOCKETS_PIN=PASS');
          NODE
      - name: Verify full release build
        run: |
          npm ci --no-audit --no-fund
          npm run test:prelaunch
          npm run build:functions
          npm run build:web
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --check
          git commit -m 'Lock rpc-websockets 9.1.3 for Netlify runtime'
          git push
