name: Apply Prelaunch Program Patch

on:
  push:
    branches:
      - agent/prelaunch-presale
    paths:
      - 'scripts/apply_prelaunch_program_patch.py'
      - 'scripts/apply_prelaunch_receipt_patch.py'
      - 'scripts/apply_delivery_preflight_patch.py'
      - 'scripts/apply_quote_grace_patch.py'
      - 'scripts/apply_owner_reconciliation_patch.py'
      - 'scripts/apply_whitepaper_links_patch.py'
      - '.github/workflows/apply-prelaunch-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prelaunch-presale
      - name: Apply deterministic release patches
        run: |
          python3 scripts/apply_prelaunch_program_patch.py
          python3 scripts/apply_prelaunch_receipt_patch.py
          python3 scripts/apply_delivery_preflight_patch.py
          python3 scripts/apply_quote_grace_patch.py
          python3 scripts/apply_owner_reconciliation_patch.py
          python3 scripts/apply_whitepaper_links_patch.py
      - name: Format and validate Rust
        run: |
          cargo fmt --all
          cargo check --manifest-path programs/rlya_sale/Cargo.toml
      - name: Validate patched browser and server tools
        run: |
          node --check web/owner/prelaunch-delivery.js
          node --check web/site-config.js
          grep -q 'QUOTE_CONFIRMATION_GRACE_MS' netlify/functions/_shared/presale-core.mts
          grep -q 'Wait for active buyer quotes to clear' netlify/functions/presale-owner.mts
          grep -q 'RALYA_Whitepaper_v1.2.html' web/index.html
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo 'No patch diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs/rlya_sale/src/lib.rs web netlify/functions/_shared/presale-core.mts netlify/functions/presale-owner.mts
          git commit -m 'Finalize prelaunch allocation release hardening'
          git push origin HEAD:agent/prelaunch-presale
