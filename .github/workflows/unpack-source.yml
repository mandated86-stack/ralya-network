name: Publish RALYA source archive

on:
  push:
    paths:
      - '.github/workflows/unpack-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand release archive
        shell: bash
        run: |
          set -euo pipefail
          archive='RALYA_GitHub_Open_Source_0.5.0.zip'
          test -f "$archive"
          temp_dir="$(mktemp -d)"
          unzip -q "$archive" -d "$temp_dir"
          rsync -a --exclude='.git/' "$temp_dir"/ ./
          rm -f "$archive"
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Publish RALYA 0.5.0 source'
          git push
