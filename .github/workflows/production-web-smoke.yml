name: Production web smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'netlify/functions/**'
      - 'netlify.toml'
      - '.github/workflows/production-web-smoke.yml'

concurrency:
  group: ralya-production-web-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Allow Netlify production rollout
        run: sleep 45

      - name: Verify owner control center route
        run: |
          body="$(curl --fail --silent --show-error --location --max-time 20 https://ralyaai.com/owner/)"
          grep -Fq 'RALYA Owner Control Center' <<<"$body"

      - name: Verify public presale state endpoint
        run: |
          curl --fail --silent --show-error --max-time 20 https://ralyaai.com/api/presale/state -o /tmp/presale-state.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/presale-state.json', 'utf8'));
          if (data.access !== 'open') throw new Error(`Presale unexpectedly ${data.access}; production must remain open`);
          if (data.backendReady !== true) throw new Error('Presale backend is not ready');
          if (!data.currentPriceMicroUsdc) throw new Error('Missing current price');
          console.log(`PRESALE_STATE=${data.access}`);
          console.log(`BACKEND_READY=${data.backendReady}`);
          NODE

      - name: Verify wallet allocation endpoint returns controlled JSON
        run: |
          code="$(curl --silent --show-error --max-time 20 \
            -o /tmp/wallet-response.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' -d '{}' \
            https://ralyaai.com/api/presale/wallet/BwurjZzEeGTVRtxshTXbxvbZjDszGdaTKXno6vqUWVFo)"
          test "$code" = "400"
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/wallet-response.json', 'utf8'));
          if (!data.error) throw new Error('Expected controlled JSON error');
          console.log('WALLET_ENDPOINT_JSON=PASS');
          NODE

      - name: Verify signed quote rejection is controlled JSON, never platform 502
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const alphabet = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
          function b58(buf) {
            let x = 0n;
            for (const b of buf) x = (x << 8n) + BigInt(b);
            let out = '';
            while (x > 0n) { const r = Number(x % 58n); x /= 58n; out = alphabet[r] + out; }
            for (const b of buf) { if (b === 0) out = '1' + out; else break; }
            return out || '1';
          }
          (async () => {
            const { publicKey } = crypto.generateKeyPairSync('ed25519');
            const der = publicKey.export({ type: 'spki', format: 'der' });
            const wallet = b58(der.subarray(der.length - 32));
            const timestamp = new Date().toISOString();
            const nonce = crypto.randomBytes(20).toString('hex');
            const message = [
              'RALYA prelaunch allocation quote',
              `Wallet: ${wallet}`,
              'USDC: 1',
              'Referrer: -',
              'Stake: NO',
              `Timestamp: ${timestamp}`,
              `Nonce: ${nonce}`,
            ].join('\n');
            const signature = crypto.randomBytes(64).toString('base64');
            const res = await fetch('https://ralyaai.com/api/presale/quote', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ wallet, usdcAmount: '1', referrer: null, stake: false, timestamp, nonce, message, signature }),
            });
            const body = await res.text();
            if (res.status !== 400) throw new Error(`Expected controlled 400, got ${res.status}: ${body}`);
            const data = JSON.parse(body);
            if (!/signature verification failed/i.test(String(data.error || ''))) throw new Error(`Unexpected quote error: ${body}`);
            console.log('SIGNED_QUOTE_REJECTION_JSON=PASS');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Verify opaque referral-code endpoint
        run: |
          code="$(curl --silent --show-error --max-time 20 -o /tmp/referral.json -w '%{http_code}' 'https://ralyaai.com/api/presale/referral?code=BAD')"
          test "$code" = "400"
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/referral.json', 'utf8'));
          if (!data.error) throw new Error('Expected controlled referral JSON error');
          console.log('REFERRAL_ENDPOINT_JSON=PASS');
          NODE

      - name: Verify same-origin Solana RPC proxy
        run: |
          curl --fail --silent --show-error --max-time 20 \
            -X POST -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' \
            https://ralyaai.com/api/solana/rpc -o /tmp/rpc.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/rpc.json', 'utf8'));
          if (data.result !== 'ok') throw new Error(`Unexpected RPC health response: ${JSON.stringify(data)}`);
          console.log('SOLANA_RPC=PASS');
          NODE

      - name: Verify clean public routes
        run: |
          for path in / /rlya /technology /roadmap /docs /presale; do
            body="$(curl --fail --silent --show-error --location --max-time 20 "https://ralyaai.com${path}")"
            grep -Fq 'RALYA' <<<"$body"
          done
