name: Devnet Protocol Self Funded
on:
  push:
    paths:
      - '.github/workflows/devnet-protocol-self-funded.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Solana JS test dependencies
        run: npm install --prefix /tmp --no-save --no-package-lock --silent @solana/web3.js@1.98.4 @solana/spl-token@0.4.14
      - name: Bootstrap and consolidate disposable Devnet gas
        run: |
          cat > /tmp/self_fund.mjs <<'JS'
          import fs from 'node:fs';
          import {Connection,Keypair,SystemProgram,Transaction,sendAndConfirmTransaction} from '@solana/web3.js';
          const RPC='https://docs-demo.solana-devnet.quiknode.pro/';
          const c=new Connection(RPC,'confirmed');
          const wallets=[];
          for(let i=0;i<5;i++){
            const k=Keypair.generate();
            wallets.push(k);
            const address=k.publicKey.toBase58();
            console.log(`BOOTSTRAP_WALLET_${i+1}=${address}`);
            try{
              const r=await fetch('https://faucet.zarply.co.za/api/faucet',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pubkey:address})});
              const text=await r.text();
              console.log(`BOOTSTRAP_HTTP_${i+1}=${r.status} ${text.slice(0,180)}`);
            }catch(e){console.log(`BOOTSTRAP_HTTP_${i+1}_ERROR=${e.message}`)}
            let seen=0;
            for(let p=0;p<45;p++){
              seen=await c.getBalance(k.publicKey,'confirmed');
              if(seen>=5000){console.log(`BOOTSTRAP_BALANCE_${i+1}=${seen}`);break}
              await new Promise(r=>setTimeout(r,1000));
            }
            if(seen<5000) console.log(`BOOTSTRAP_WALLET_${i+1}_UNFUNDED`);
          }
          const admin=wallets[0];
          const adminStart=await c.getBalance(admin.publicKey,'confirmed');
          if(adminStart<5000) throw new Error('Primary bootstrap wallet not funded');
          for(let i=1;i<wallets.length;i++){
            const donor=wallets[i];
            const bal=await c.getBalance(donor.publicKey,'confirmed');
            if(bal>0){
              const tx=new Transaction().add(SystemProgram.transfer({fromPubkey:donor.publicKey,toPubkey:admin.publicKey,lamports:bal}));
              tx.feePayer=admin.publicKey;
              const sig=await sendAndConfirmTransaction(c,tx,[admin,donor],{commitment:'confirmed'});
              console.log(`BOOTSTRAP_CONSOLIDATE_TX=${sig}`);
            }
          }
          let final=0;
          for(let i=0;i<30;i++){
            final=await c.getBalance(admin.publicKey,'confirmed');
            if(final>=30_000_000) break;
            await new Promise(r=>setTimeout(r,1000));
          }
          console.log('SELF_FUNDED_ADMIN='+admin.publicKey.toBase58());
          console.log('SELF_FUNDED_BALANCE='+final);
          if(final<30_000_000) throw new Error('Self-funded Devnet balance below 0.03 SOL');
          fs.writeFileSync('/tmp/rlya-self-funded-payer.json',JSON.stringify(Array.from(admin.secretKey)));
          console.log('RALYA_SELF_FUNDING=PASS');
          JS
          node /tmp/self_fund.mjs
      - name: Build hardened public Devnet protocol harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('scripts/local_validator_smoke.sh').read_text()
          marker="cat > /tmp/ralya_local_integration.mjs <<'JS'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\nJS\n\nRALYA_PROGRAM_ID=",start)
          js=src[start:end]
          rpc='https://docs-demo.solana-devnet.quiknode.pro/'
          js=js.replace("const RPC='http://127.0.0.1:8899';",f"const RPC='{rpc}';")
          js=js.replace("if(!RPC.includes('127.0.0.1')) throw new Error('Integration harness refuses non-local RPC');",f"if(RPC!=='{rpc}') throw new Error('Devnet harness refuses unexpected RPC');")
          js=js.replace("/tmp/ralya-local-payer.json","/tmp/rlya-self-funded-payer.json")
          js,n=re.subn(r"const fundTx=new Transaction\(\);for\(const k of \[treasury,founder,buyer,buyer2,referrer,manual,attacker,impostor\]\)fundTx\.add\(SystemProgram\.transfer\(\{fromPubkey:admin\.publicKey,toPubkey:k\.publicKey,lamports:3\*LAMPORTS_PER_SOL\}\)\);\nawait sendAndConfirmTransaction\(c,fundTx,\[admin\]\);",
              "const fundTx=new Transaction().add(SystemProgram.transfer({fromPubkey:admin.publicKey,toPubkey:buyer2.publicKey,lamports:3_000_000}));\nawait sendAndConfirmTransaction(c,fundTx,[admin],{commitment:'confirmed'});\nconsole.log('REFERRAL_RENT_WALLET_FUNDED=PASS');",js,count=1)
          if n!=1: raise SystemExit('Could not replace actor funding block')
          js=js.replace("TOKEN_PROGRAM_ID,AuthorityType,createMint,getAccount,getMint,getOrCreateAssociatedTokenAccount,mintTo,setAuthority,transferChecked","TOKEN_PROGRAM_ID,AuthorityType,createMint,createAccount,getAccount,getMint,mintTo,setAuthority,transferChecked")
          js,n=re.subn(r"\(await getOrCreateAssociatedTokenAccount\(c,admin,([^,\n]+),([^\)\n]+)\)\)\.address",r"await createAccount(c,admin,\1,\2)",js)
          if n < 9: raise SystemExit(f'Expected token-account replacements, got {n}')
          js=js.replace("const c=new Connection(RPC,'confirmed');","const c=new Connection(RPC,'finalized');")
          js=js.replace("{commitment:'confirmed'}","{commitment:'finalized'}")
          old_send="async function send(i,extra=[]){return sendAndConfirmTransaction(c,new Transaction().add(i),[admin,...extra.filter(x=>!x.publicKey.equals(admin.publicKey))],{commitment:'confirmed'})}"
          new_send="async function send(i,extra=[]){const sig=await sendAndConfirmTransaction(c,new Transaction().add(i),[admin,...extra.filter(x=>!x.publicKey.equals(admin.publicKey))],{commitment:'finalized'});console.log('RLYA_PROTOCOL_TX='+sig);return sig}"
          if old_send in js:
              js=js.replace(old_send,new_send,1)
          else:
              old_send2="async function send(i,extra=[]){return sendAndConfirmTransaction(c,new Transaction().add(i),[admin,...extra.filter(x=>!x.publicKey.equals(admin.publicKey))],{commitment:'finalized'})}"
              if old_send2 not in js: raise SystemExit('Could not install transaction signature logging')
              js=js.replace(old_send2,new_send,1)
          needle="const c=new Connection(RPC,'finalized');\n"
          harden=r'''const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const rawRpc=c._rpcRequest.bind(c);
          let rpcTail=Promise.resolve();
          c._rpcRequest=(method,args)=>{
            const task=rpcTail.then(async()=>{
              await sleep(650);
              let last;
              for(let attempt=1;attempt<=10;attempt++){
                try{
                  const res=await rawRpc(method,args);
                  if(res?.error?.code===429) throw new Error('RPC 429');
                  return res;
                }catch(e){last=e;if(attempt===10) throw e;await sleep(1200*attempt)}
              }
              throw last;
            });
            rpcTail=task.catch(()=>{});
            return task;
          };
          c.confirmTransaction=async(sigOrStrategy)=>{
            const sig=typeof sigOrStrategy==='string'?sigOrStrategy:sigOrStrategy.signature;
            for(let i=0;i<100;i++){
              const st=await c.getSignatureStatuses([sig],{searchTransactionHistory:true});
              const v=st.value[0];
              if(v){
                if(v.err) throw new Error('Transaction failed: '+JSON.stringify(v.err));
                if(v.confirmationStatus==='finalized') return {context:st.context,value:{err:null}};
              }
              await sleep(1400);
            }
            throw new Error('Timed out waiting for Devnet transaction finalization');
          };
          async function readAmount(a){let last;for(let i=1;i<=12;i++){try{return (await getAccount(c,a,'finalized')).amount}catch(e){last=e;await sleep(1200*i)}}throw last}
          async function readMint(m){let last;for(let i=1;i<=12;i++){try{return await getMint(c,m,'finalized')}catch(e){last=e;await sleep(1200*i)}}throw last}
          '''
          if needle not in js: raise SystemExit('Could not install hardened RPC layer')
          js=js.replace(needle,needle+harden,1)
          js=js.replace("async function amt(a){return(await getAccount(c,a)).amount}","async function amt(a){return await readAmount(a)}")
          js=js.replace("const mint=await getMint(c,rlya);","const mint=await readMint(rlya);")
          old="async function getState(s){const a=await c.getAccountInfo(s);assert(a);return state(a.data)}"
          new="async function getState(s){let last;for(let i=1;i<=12;i++){try{const a=await c.getAccountInfo(s,'finalized');if(a)return state(a.data)}catch(e){last=e}await sleep(1200*i)}throw last||new Error('sale state unavailable')}"
          if old not in js: raise SystemExit('Could not install state read retry')
          js=js.replace(old,new,1)
          cut="const [attRef]=PublicKey.findProgramAddressSync([referralSeed,attacker.publicKey.toBuffer()],PROGRAM_ID);"
          pos=js.index(cut)
          tail=r'''
          const mint=await readMint(rlya);assert.equal(mint.supply,HARD);assert.equal(mint.mintAuthority,null);assert.equal(mint.freezeAuthority,null);
          s=await getState(sale);assert.equal(s.raised,600n*U);assert.equal(s.refPaid,5n*U);assert.equal(s.sold,q+q2+man);assert.equal(s.manual,man);
          console.log(JSON.stringify({status:'PASS',network:'devnet',programId:PROGRAM_ID.toBase58(),rlyaMint:rlya.toBase58(),usdcMint:usdc.toBase58(),sale:sale.toBase58(),totalSold:s.sold.toString(),grossUsdc:s.raised.toString(),referralUsdc:s.refPaid.toString(),priceMicroUsdc:price(s).toString(),guardCount}));
          console.log('RALYA_DEVNET_PROTOCOL_INTEGRATION=PASS');
          '''
          js=js[:pos]+tail
          Path('/tmp/rlya_devnet_protocol_integration.mjs').write_text(js)
          PY
          node --check /tmp/rlya_devnet_protocol_integration.mjs
      - name: Execute RLYA public Devnet protocol integration
        run: |
          RALYA_PROGRAM_ID='Dk5eeCK6KmYY4b6pQkCRpfbZViwEjYJLryjZoUgBxsHN' node /tmp/rlya_devnet_protocol_integration.mjs 2>&1 | tee /tmp/rlya-devnet-protocol-final.log
          grep -F 'RALYA_DEVNET_PROTOCOL_INTEGRATION=PASS' /tmp/rlya-devnet-protocol-final.log
