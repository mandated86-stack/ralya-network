name: Web fast checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/web-fast.yml'
      - 'web/**'
      - 'netlify/**'
      - 'netlify.toml'
      - 'package.json'
      - 'scripts/build_web_prod.sh'
      - 'scripts/audit_source.py'
      - 'scripts/audit_prelaunch.py'
      - 'scripts/audit_site_copy.py'
  pull_request:
    paths:
      - '.github/workflows/web-fast.yml'
      - 'web/**'
      - 'netlify/**'
      - 'netlify.toml'
      - 'package.json'
      - 'scripts/build_web_prod.sh'
      - 'scripts/audit_source.py'
      - 'scripts/audit_prelaunch.py'
      - 'scripts/audit_site_copy.py'

concurrency:
  group: rlya-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit release/source invariants without rebuilding Solana
        run: |
          python3 scripts/audit_source.py
          python3 scripts/audit_prelaunch.py
          python3 scripts/audit_site_copy.py
      - name: Install exact web/function dependencies
        run: npm install --no-audit --no-fund
      - name: Test presale economics used by the website
        run: npm run test:prelaunch
      - name: Compile Netlify functions
        run: npm run build:functions
      - name: Build and syntax-check production browser bundle
        run: npm run build:web
      - name: Fast-lane marker
        run: echo 'RALYA_WEB_FAST_CHECK=PASS'
