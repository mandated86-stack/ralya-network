name: Devnet Tiny Bootstrap
on:
  push:
    paths:
      - '.github/workflows/devnet-tiny-bootstrap.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install web3
        run: npm install --prefix /tmp --no-save --no-package-lock --silent @solana/web3.js@1.98.4
      - name: Request tiny CI bootstrap
        run: |
          cat > /tmp/probe.mjs <<'JS'
          import {Connection,Keypair} from '@solana/web3.js';
          const c=new Connection('https://api.devnet.solana.com','confirmed');
          const k=Keypair.generate();
          console.log('BOOTSTRAP_ADDRESS='+k.publicKey.toBase58());
          let last;
          for(const amount of [1_000_000,100_000,10_000]){
            try{
              const sig=await c.requestAirdrop(k.publicKey,amount);
              console.log('BOOTSTRAP_SIG='+sig+' amount='+amount);
              for(let i=0;i<30;i++){
                const b=await c.getBalance(k.publicKey,'confirmed');
                if(b>=10_000){console.log('TINY_BOOTSTRAP=PASS balance='+b);process.exit(0)}
                await new Promise(r=>setTimeout(r,1000));
              }
            }catch(e){last=e;console.log('bootstrap attempt '+amount+' failed: '+e.message);}
          }
          throw last||new Error('tiny bootstrap failed');
          JS
          node /tmp/probe.mjs
