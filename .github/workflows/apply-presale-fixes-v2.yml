name: Apply presale fixes v2
on:
  push:
    branches:
      - fix/presale-purchase-referral-ui-2026-08-16
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          q = Path('netlify/functions/presale-quote.mts')
          s = q.read_text(encoding='utf-8')
          s = s.replace("import { createHash, createPublicKey, verify as verifySignature } from 'node:crypto';", "import { createHash, webcrypto } from 'node:crypto';")
          old_key = '''function buyerKey(wallet: string) {\n  const raw = bs58.decode(wallet);\n  if (raw.length !== 32) throw new Error('Invalid buyer public key length.');\n  const der = Buffer.concat([Buffer.from('302a300506032b6570032100', 'hex'), Buffer.from(raw)]);\n  return createPublicKey({ key: der, format: 'der', type: 'spki' });\n}\n'''
          if old_key not in s: raise SystemExit('buyerKey block not found')
          s = s.replace(old_key, '', 1)
          s = s.replace('function verifyBuyerRequest(body: any, buyer: string, referrer: string | null) {', 'async function verifyBuyerRequest(body: any, buyer: string, referrer: string | null) {', 1)
          old_verify = '''  let signature: Buffer;\n  try { signature = Buffer.from(signatureB64, 'base64'); } catch { throw new Error('Invalid quote signature encoding.'); }\n  if (signature.length !== 64) throw new Error('Invalid quote signature length.');\n  if (!verifySignature(null, Buffer.from(message, 'utf8'), buyerKey(buyer), signature)) throw new Error('Buyer quote signature verification failed.');\n  return { usdcAmount, stake, nonce };'''
          new_verify = '''  let signature: Buffer;\n  try { signature = Buffer.from(signatureB64, 'base64'); } catch { throw new Error('Invalid quote signature encoding.'); }\n  if (signature.length !== 64) throw new Error('Invalid quote signature length.');\n  const rawKey = bs58.decode(buyer);\n  if (rawKey.length !== 32) throw new Error('Invalid buyer public key length.');\n  const key = await webcrypto.subtle.importKey('raw', rawKey, { name: 'Ed25519' }, false, ['verify']);\n  const ok = await webcrypto.subtle.verify({ name: 'Ed25519' }, key, signature, Buffer.from(message, 'utf8'));\n  if (!ok) throw new Error('Buyer quote signature verification failed.');\n  return { usdcAmount, stake, nonce };'''
          if old_verify not in s: raise SystemExit('native quote verification block not found')
          s = s.replace(old_verify, new_verify, 1)
          s = s.replace('    const auth = verifyBuyerRequest(body, buyer, requestedReferrer);', '    const auth = await verifyBuyerRequest(body, buyer, requestedReferrer);', 1)
          q.write_text(s, encoding='utf-8')

          Path('netlify/functions/presale-referral.mts').write_text('''import { createHash } from 'node:crypto';\nimport { assertWallet, json, store } from './_shared/presale-core.mts';\n\nconst CODE_RE = /^[A-F0-9]{10}$/;\n\nfunction codeFor(wallet: string) {\n  return createHash('sha256').update(`RALYA-REFERRAL-V1:${wallet}`).digest('hex').slice(0, 10).toUpperCase();\n}\n\nexport default async (req: Request) => {\n  try {\n    const s = store();\n    if (req.method === 'POST') {\n      let body: any;\n      try { body = await req.json(); } catch { return json({ error: 'Invalid JSON.' }, 400); }\n      const wallet = assertWallet(body?.wallet, 'Referral wallet');\n      const code = codeFor(wallet);\n      const record = { code, wallet, createdAt: new Date().toISOString() };\n      await Promise.all([s.setJSON(`refcode/${code}`, record), s.setJSON(`refwallet/${wallet}`, record)]);\n      return json({ ok: true, code });\n    }\n    if (req.method === 'GET') {\n      const code = String(new URL(req.url).searchParams.get('code') || '').trim().toUpperCase();\n      if (!CODE_RE.test(code)) return json({ error: 'Invalid referral code.' }, 400);\n      const record: any = await s.get(`refcode/${code}`, { type: 'json' });\n      if (!record?.wallet) return json({ error: 'Referral code not found.' }, 404);\n      return json({ ok: true, code, wallet: assertWallet(record.wallet, 'Referral wallet') });\n    }\n    return json({ error: 'Method not allowed.' }, 405);\n  } catch (err: any) {\n    return json({ error: err?.message || 'Referral service unavailable.' }, 400);\n  }\n};\n\nexport const config = { path: '/api/presale/referral' };\n''', encoding='utf-8')

          p = Path('web/prelaunch.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('let referralWallet = null;\nlet lockedReferrer = null;', 'let referralWallet = null;\nlet referralCode = null;\nlet lockedReferrer = null;', 1)
          s = s.replace("function referralLinkFor(address) { const url = new URL(cfg.projectUrl || window.location.origin); url.pathname = '/presale'; url.searchParams.set('ref', address); url.hash = ''; return url.toString(); }", "function referralLinkForCode(code) { const url = new URL(cfg.projectUrl || window.location.origin); url.pathname = '/presale'; url.searchParams.set('ref', String(code || '').toUpperCase()); url.hash = ''; return url.toString(); }\nconst REFERRAL_CODE_RE = /^[A-F0-9]{10}$/;", 1)
          s = s.replace("    if (input) { input.value = lockedReferrer; input.disabled = true; }\n    if ($('#referralStatus')) $('#referralStatus').textContent = `Locked referral: ${shorten(lockedReferrer)} · receives 1% of referred USDC purchases`;", "    if (input) { input.value = referralCode || 'Referral locked'; input.disabled = true; }\n    if ($('#referralStatus')) $('#referralStatus').textContent = 'Referral locked for this wallet · referrer receives 1% of referred USDC purchases';", 1)
          s = s.replace("    referralWallet = null;\n    if (input) input.value = '';", "    referralWallet = null;\n    referralCode = null;\n    if (input) input.value = '';", 1)
          s = s.replace("    referralWallet = pk;\n    if (input) input.value = pk.toBase58();", "    referralWallet = pk;\n    referralCode = null;\n    if (input) input.value = pk.toBase58();", 1)
          old = "function loadReferralFromUrl() { const value = new URL(window.location.href).searchParams.get('ref'); if (value) setReferral(value, true); }\nfunction updateReferralLink() {\n  const input = $('#myReferralLink'); const button = $('#copyReferralLink'); if (!input || !button) return;\n  if (!wallet) { input.value = 'Connect wallet to create your referral link'; button.disabled = true; }\n  else { input.value = referralLinkFor(wallet.toBase58()); button.disabled = false; }\n}"
          new = '''async function applyReferralValue(raw, quiet = false) {\n  const value = String(raw || '').trim();\n  if (REFERRAL_CODE_RE.test(value.toUpperCase())) {\n    try {\n      const code = value.toUpperCase();\n      const resolved = await fetchJson(`/api/presale/referral?code=${encodeURIComponent(code)}`);\n      referralWallet = new PublicKey(resolved.wallet);\n      if (wallet && referralWallet.equals(wallet)) throw new Error('You cannot refer your own wallet.');\n      referralCode = code;\n      const input = $('#referralInput');\n      if (input) input.value = code;\n      if ($('#referralStatus')) $('#referralStatus').textContent = `Referral code ${code} attached · referrer receives 1% of this purchase in USDC`;\n      return referralWallet;\n    } catch (err) {\n      referralWallet = null; referralCode = null;\n      if (!quiet) toast(err.message || 'Invalid referral code.');\n      if ($('#referralStatus')) $('#referralStatus').textContent = 'Referral code is invalid.';\n      return null;\n    }\n  }\n  return setReferral(value, quiet);\n}\nasync function loadReferralFromUrl() {\n  const value = new URL(window.location.href).searchParams.get('ref');\n  if (value) await applyReferralValue(value, true);\n}\nasync function registerReferralCode() {\n  if (!wallet) return null;\n  const data = await fetchJson('/api/presale/referral', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ wallet: wallet.toBase58() }) });\n  referralCode = String(data.code || '').toUpperCase();\n  if (!REFERRAL_CODE_RE.test(referralCode)) throw new Error('Referral service returned an invalid code.');\n  return referralCode;\n}\nasync function updateReferralLink() {\n  const input = $('#myReferralLink'); const button = $('#copyReferralLink'); if (!input || !button) return;\n  if (!wallet) { input.value = 'Connect wallet to create your referral link'; button.disabled = true; return; }\n  try { const code = await registerReferralCode(); input.value = referralLinkForCode(code); button.disabled = false; }\n  catch { input.value = 'Referral link temporarily unavailable'; button.disabled = true; }\n}'''
          if old not in s: raise SystemExit('referral link block not found')
          s = s.replace(old, new, 1)
          s = s.replace('      updateReferralLink();\n      await refreshWallet();', '      await updateReferralLink();\n      await refreshWallet();', 1)
          s = s.replace("  button.textContent = wantsStake() ? 'Buy + Stake · secure allocation' : 'Secure my presale allocation';", "  button.textContent = 'BUY';", 1)
          s = s.replace('expected total includes fixed 5% bonus', 'total includes fixed 5% bonus')
          s = s.replace("  const typedReferral = String($('#referralInput')?.value || '').trim(); if (typedReferral) setReferral(typedReferral);", "  const typedReferral = String($('#referralInput')?.value || '').trim();\n  if (!lockedReferrer && typedReferral && !(referralCode && typedReferral.toUpperCase() === referralCode)) await applyReferralValue(typedReferral);", 1)
          s = s.replace("$('#referralInput')?.addEventListener('change', e => setReferral(e.target.value));", "$('#referralInput')?.addEventListener('change', e => applyReferralValue(e.target.value).catch(err => toast(err.message || 'Invalid referral.')));", 1)
          old = "    await activateReferralReceiving();\n    await navigator.clipboard.writeText(referralLinkFor(wallet.toBase58()));\n    toast('Referral link copied. Your wallet is ready to receive referral USDC.');"
          new = "    await activateReferralReceiving();\n    const code = await registerReferralCode();\n    const link = referralLinkForCode(code);\n    if ($('#myReferralLink')) $('#myReferralLink').value = link;\n    await navigator.clipboard.writeText(link);\n    toast('Referral link copied. Your wallet is ready to receive referral USDC.');"
          if old not in s: raise SystemExit('copy referral block not found')
          s = s.replace(old, new, 1)
          s = s.replace('wireGithub(); loadReferralFromUrl(); updateReferralLink(); syncStakeUi();', "wireGithub(); loadReferralFromUrl().catch(() => {}); updateReferralLink().catch(() => {}); syncStakeUi();", 1)
          p.write_text(s, encoding='utf-8')

          h = Path('web/index.html')
          s = h.read_text(encoding='utf-8').replace('full expected RLYA allocation', 'full RLYA allocation')
          old = '<div class="cta-row"><a class="btn btn-primary" id="presaleHeroCta" href="#presale">View RLYA presale</a><a class="btn btn-secondary" href="RALYA_Whitepaper_v1.2.html">Read whitepaper v1.2</a></div>'
          new = old + '\n        <a class="hero-github-trust" href="https://github.com/mandated86-stack/ralya-network" target="_blank" rel="noopener noreferrer">View RALYA source on GitHub ↗</a>'
          if old not in s: raise SystemExit('hero CTA not found')
          h.write_text(s.replace(old, new, 1), encoding='utf-8')

          for rel in ('web/site-ui.js','web/site-ui-hotfix.js'):
            f=Path(rel); t=f.read_text(encoding='utf-8').replace('full expected RLYA allocation','full RLYA allocation').replace('their full expected RLYA allocation','their full RLYA allocation'); f.write_text(t,encoding='utf-8')

          css=Path('web/styles.css'); s=css.read_text(encoding='utf-8')
          if '/* RALYA presale BUY + GitHub trust refinements */' not in s:
            s += '''\n\n/* RALYA presale BUY + GitHub trust refinements */\n#buyRlya { min-height:72px; font-size:1.45rem; font-weight:900; letter-spacing:.08em; text-transform:uppercase; border-radius:18px; box-shadow:0 14px 34px rgba(14,165,233,.22); }\n#buyRlya:not(:disabled) { background:linear-gradient(110deg,#0b8ff0 0%,#13b8a6 100%); color:#fff; }\n.hero-github-trust { display:inline-flex; margin-top:12px; font-weight:800; text-decoration:none; color:#167f88; }\n.hero-github-trust:hover { text-decoration:underline; }\n'''
          css.write_text(s,encoding='utf-8')

          pkg=Path('package.json'); data=json.loads(pkg.read_text(encoding='utf-8')); old=data['scripts']['build:functions']
          if 'netlify/functions/presale-referral.mts' not in old: data['scripts']['build:functions']=old.replace('netlify/functions/presale-wallet.mts','netlify/functions/presale-wallet.mts netlify/functions/presale-referral.mts')
          pkg.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          if grep -R -n "Secure my presale allocation\|full expected RLYA allocation" web; then exit 1; fi
          grep -Fq "button.textContent = 'BUY'" web/prelaunch.js
          grep -Fq 'webcrypto.subtle.verify' netlify/functions/presale-quote.mts
          cp web/prelaunch.js /tmp/prelaunch-source.js
      - name: Verify builds
        run: |
          npm ci --no-audit --no-fund
          npm run build:functions
          npm run test:prelaunch
          npm run build:web
          cp /tmp/prelaunch-source.js web/prelaunch.js
          node --check web/prelaunch.js
      - name: Commit non-workflow changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/presale-quote.mts netlify/functions/presale-referral.mts web/prelaunch.js web/index.html web/styles.css web/site-ui.js web/site-ui-hotfix.js package.json
          git diff --cached --check
          git commit -m 'Fix presale checkout and use opaque referral codes'
          git push
