name: Devnet Balance Check
on:
  push:
    paths:
      - '.github/workflows/devnet-balance-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check funded address across Devnet RPCs
        shell: bash
        run: |
          set -u
          ADDRESS='9dk35k85MWFzqQgofzsU9z1y317Rb8xufk3TuBUxPTo'
          for RPC in 'https://docs-demo.solana-devnet.quiknode.pro/' 'https://api.devnet.solana.com'; do
            echo "RPC=$RPC"
            for i in 1 2 3; do
              BODY=$(curl -L -sS --max-time 15 -H 'content-type: application/json' --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getBalance\",\"params\":[\"$ADDRESS\",{\"commitment\":\"finalized\"}]}" "$RPC" 2>/dev/null || true)
              echo "$BODY"
              sleep 1
            done
          done
