name: Keep presale open
on:
  workflow_dispatch:
  push:
    branches:
      - fix/keep-presale-open-2026-08-16
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep production presale open
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('netlify/functions/_shared/presale-core.mts')
          text = core.read_text(encoding='utf-8')

          old_default = """const DEFAULT_CONTROL: PresaleControl = {\n  access: 'closed',\n  updatedAt: null,\n  updatedBy: null,\n};"""
          new_default = """const DEFAULT_CONTROL: PresaleControl = {\n  access: 'open',\n  updatedAt: null,\n  updatedBy: null,\n};"""
          if old_default not in text:
              raise SystemExit('DEFAULT_CONTROL block not found')
          text = text.replace(old_default, new_default, 1)

          old_get = """export async function getControl(s = store()) {\n  return (await s.get('control', { type: 'json' }) as PresaleControl | null) || DEFAULT_CONTROL;\n}"""
          new_get = """function forcePresaleOpen() {\n  const value = (globalThis as any).Netlify?.env?.get?.('RALYA_PRESALE_FORCE_OPEN');\n  return /^(1|true|yes|on)$/i.test(String(value || '').trim());\n}\n\nexport async function getControl(s = store()) {\n  const stored = (await s.get('control', { type: 'json' }) as PresaleControl | null) || DEFAULT_CONTROL;\n  if (forcePresaleOpen() && stored.access === 'closed') return { ...stored, access: 'open' as const };\n  return stored;\n}"""
          if old_get not in text:
              raise SystemExit('getControl block not found')
          text = text.replace(old_get, new_get, 1)
          core.write_text(text, encoding='utf-8')
          PY
      - name: Commit hardened open state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/_shared/presale-core.mts
          git diff --cached --check
          git commit -m 'Keep presale open across production deploys'
          git push
