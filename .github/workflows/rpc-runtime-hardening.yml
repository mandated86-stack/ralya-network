name: Final RPC runtime hardening

on:
  push:
    branches:
      - build/presale-stability-wallet-2026-08-16

permissions:
  contents: write

concurrency:
  group: rlya-rpc-runtime-hardening
  cancel-in-progress: false

jobs:
  harden-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[rpc-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/presale-stability-wallet-2026-08-16
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove public Solana RPC fallbacks from production server paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('netlify/functions/presale-confirm.mts'),
              Path('netlify/functions/presale-owner.mts'),
          ]
          old = """function rpcEndpoint() {\n  return (globalThis as any).Netlify?.env?.get?.('RALYA_SOLANA_RPC') || 'https://api.mainnet-beta.solana.com';\n}"""
          new = """function rpcEndpoint() {\n  const endpoint = (globalThis as any).Netlify?.env?.get?.('RALYA_SOLANA_RPC');\n  if (!endpoint) throw new Error('Dedicated Solana Mainnet RPC is not configured. Keep presale access CLOSED.');\n  const parsed = new URL(endpoint);\n  if (parsed.protocol !== 'https:') throw new Error('Dedicated Solana Mainnet RPC must use HTTPS.');\n  return parsed.toString();\n}"""
          for path in files:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one public RPC fallback, found {text.count(old)}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Strengthen permanent public/runtime audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit_presale_public.py')
          s = p.read_text(encoding='utf-8')
          anchor = "rpc = read('netlify/functions/solana-rpc.mts')\n"
          insert = "confirm = read('netlify/functions/presale-confirm.mts')\nowner = read('netlify/functions/presale-owner.mts')\n"
          if insert not in s:
              if s.count(anchor) != 1: raise SystemExit('audit read anchor missing')
              s = s.replace(anchor, anchor + insert)
          anchor2 = "check(\"path: '/api/solana/rpc'\" in rpc, 'server RPC proxy route is missing')\n"
          insert2 = "check('https://api.mainnet-beta.solana.com' not in confirm and 'https://api.mainnet-beta.solana.com' not in owner, 'production presale server code still falls back to the public Solana RPC')\ncheck(\"Dedicated Solana Mainnet RPC is not configured\" in confirm and \"Dedicated Solana Mainnet RPC is not configured\" in owner, 'production presale server paths do not fail closed when dedicated RPC is missing')\n"
          if insert2 not in s:
              if s.count(anchor2) != 1: raise SystemExit('audit check anchor missing')
              s = s.replace(anchor2, anchor2 + insert2)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/rpc-runtime-hardening.yml
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Audit pre-launch invariants
        run: python3 scripts/audit_prelaunch.py
      - name: Audit final checkout release policy
        run: python3 scripts/audit_checkout_release.py
      - name: Audit public presale/runtime boundaries
        run: python3 scripts/audit_presale_public.py
      - name: Test pre-launch economic invariants
        run: npm run test:prelaunch
      - name: Compile Netlify functions
        run: npm run build:functions
      - name: Build production browser bundles
        run: npm run build:web
      - name: Restore source tree after bundle smoke build
        run: git restore --worktree .
      - name: Re-run permanent audit
        run: python3 scripts/audit_presale_public.py
      - name: Commit hardened runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[rpc-hardening] require dedicated Solana RPC in production"
          git push origin HEAD:build/presale-stability-wallet-2026-08-16
