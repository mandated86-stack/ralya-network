name: Owner route diagnostic

on:
  workflow_dispatch:
  push:
    branches: ['diag/owner-route-2026-08-16']
    paths: ['.github/workflows/owner-route-diagnostic.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print owner route responses
        run: |
          for path in /owner /owner/ /owner-control.html /owner/index.html; do
            echo "===== $path ====="
            curl --silent --show-error --max-time 15 -D - -o /tmp/body "https://ralyaai.com${path}" || true
            echo "--- body head ---"
            head -c 180 /tmp/body || true
            echo
          done
