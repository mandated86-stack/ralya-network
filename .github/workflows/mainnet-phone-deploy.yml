name: Mainnet Phone Deploy (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse ephemeral production-key deployment
        run: |
          echo "RALYA_MAINNET_PHONE_DEPLOY=DISABLED"
          echo "Production deployment keys must not exist only on an ephemeral GitHub runner."
          echo "Use scripts/mainnet_program_deploy.ps1 on Windows or scripts/mainnet_program_deploy.sh on macOS/Linux."
          exit 1
