name: Maintenance
on:
  push:
    paths:
      - '.github/workflows/maintenance.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed CI compile-mode fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/build_solana.sh')
          s = p.read_text()
          s = s.replace('anchor build', 'anchor test --skip-deploy --skip-local-validator')
          p.write_text(s)
      - name: Commit reviewed change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_solana.sh
          git commit -m 'Use Anchor test-mode compiler gate' || exit 0
          git push
