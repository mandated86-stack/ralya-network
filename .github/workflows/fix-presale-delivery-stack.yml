name: Fix presale delivery stack
on:
  workflow_dispatch:
  push:
    branches:
      - build/presale-celebration-wallet-delivery-v4-2026-08-16
    paths:
      - 'scripts/fix_presale_delivery_stack.py'
      - '.github/workflows/fix-presale-delivery-stack.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/presale-celebration-wallet-delivery-v4-2026-08-16
      - name: Apply delivery stack-frame fix
        run: python3 scripts/fix_presale_delivery_stack.py
      - name: Reject malformed output
        run: git diff --check
      - name: Commit generated Rust fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs/rlya_sale/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Box presale delivery accounts to stay within Solana stack limit'
          git push origin HEAD:build/presale-celebration-wallet-delivery-v4-2026-08-16
