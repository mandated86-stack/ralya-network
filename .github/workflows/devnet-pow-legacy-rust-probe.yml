name: Devnet PoW Legacy Rust Probe
on:
  push:
    paths:
      - '.github/workflows/devnet-pow-legacy-rust-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install compatible Rust toolchain
        run: rustup toolchain install 1.68.2 --profile minimal
      - name: Install Devnet PoW CLI
        run: cargo +1.68.2 install devnet-pow --locked
      - name: Verify CLI
        run: devnet-pow --version && echo RALYA_POW_CLI=PASS
