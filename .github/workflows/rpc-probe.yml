name: Devnet RPC Probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rpc-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe QuickNode Devnet read and transaction RPC
        shell: bash
        run: |
          set -euo pipefail
          RPC='https://docs-demo.solana-devnet.quiknode.pro/'
          PROGRAM='Dk5eeCK6KmYY4b6pQkCRpfbZViwEjYJLryjZoUgBxsHN'

          for i in $(seq 1 15); do
            BODY=$(curl -L -sS --fail-with-body --max-time 15 -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getAccountInfo\",\"params\":[\"$PROGRAM\",{\"encoding\":\"base64\",\"commitment\":\"finalized\"}]}" \
              "$RPC")
            echo "$BODY" | grep -q '"executable":true'
            echo "QuickNode program read $i/15 PASS"
            sleep 1
          done

          BH=$(curl -L -sS --fail-with-body --max-time 15 -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"getLatestBlockhash","params":[{"commitment":"finalized"}]}' \
            "$RPC")
          echo "$BH" | grep -q '"blockhash"'
          echo 'QuickNode blockhash PASS'

          TX=$(curl -L -sS --fail-with-body --max-time 15 -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"sendTransaction","params":["AA==",{"encoding":"base64","skipPreflight":true}]}' \
            "$RPC")
          echo "Transaction-method probe response: ${TX:0:240}"
          if echo "$TX" | grep -Eqi 'unauthorized|forbidden|payment required|method not found|not supported'; then
            echo 'QuickNode transaction RPC is restricted.' >&2
            exit 1
          fi
          echo "$TX" | grep -q '"error"'
          echo 'QUICKNODE_DEVNET_TRANSACTION_RPC=PASS'
