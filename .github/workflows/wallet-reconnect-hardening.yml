name: Wallet reconnect hardening

on:
  push:
    branches:
      - build/presale-stability-wallet-2026-08-16

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[wallet-reconnect]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/presale-stability-wallet-2026-08-16
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prevent duplicate reconnect events
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/presale-next.js')
          s = p.read_text(encoding='utf-8')
          old_install = """function installProvider() {\n  const adapter = providerFromConnector();\n  if (!adapter) return false;\n  window.RALYA_WALLET_PROVIDER = adapter;\n  window.dispatchEvent(new CustomEvent('ralya:wallet-standard-connected', { detail: { address: adapter.publicKey.toBase58() } }));\n  return true;\n}\n"""
          new_install = """let installedWalletAddress = '';\nfunction installProvider() {\n  const adapter = providerFromConnector();\n  if (!adapter) return false;\n  const address = adapter.publicKey.toBase58();\n  const changed = address !== installedWalletAddress;\n  installedWalletAddress = address;\n  window.RALYA_WALLET_PROVIDER = adapter;\n  if (changed) window.dispatchEvent(new CustomEvent('ralya:wallet-standard-connected', { detail: { address } }));\n  return true;\n}\n"""
          if s.count(old_install) != 1:
              raise SystemExit(f'installProvider match count {s.count(old_install)}')
          s = s.replace(old_install, new_install)
          old_sync = """function syncConnectedState(state = client.getSnapshot()) {\n  if (state.wallet?.status !== 'connected' && !state.connected) return;\n  if (!installProvider()) return;\n  const { address } = stateAccount(state);\n  if (address) $$('.wallet-button').forEach(button => { button.textContent = shorten(address); });\n}\n"""
          new_sync = """function syncConnectedState(state = client.getSnapshot()) {\n  if (state.wallet?.status !== 'connected' && !state.connected) {\n    installedWalletAddress = '';\n    window.RALYA_WALLET_PROVIDER = null;\n    return;\n  }\n  if (!installProvider()) return;\n  const { address } = stateAccount(state);\n  if (address) $$('.wallet-button').forEach(button => { button.textContent = shorten(address); });\n}\n"""
          if s.count(old_sync) != 1:
              raise SystemExit(f'syncConnectedState match count {s.count(old_sync)}')
          p.write_text(s.replace(old_sync, new_sync), encoding='utf-8')
          PY
      - name: Add reconnect guard to permanent audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit_presale_public.py'); s = p.read_text(encoding='utf-8')
          anchor = "check('Live presale data reconnecting…' in wallet, 'small fail-closed reconnect status is missing')\n"
          line = "check(\"let installedWalletAddress = ''\" in wallet and \"if (changed) window.dispatchEvent\" in wallet, 'Wallet Standard subscription can emit duplicate reconnect events/signing prompts')\n"
          if line not in s:
              if s.count(anchor) != 1: raise SystemExit('audit wallet anchor missing')
              s = s.replace(anchor, anchor + line)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/wallet-reconnect-hardening.yml
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Stage source changes
        run: git add -A
      - name: Audit public presale/runtime boundaries
        run: python3 scripts/audit_presale_public.py
      - name: Audit final checkout release policy
        run: python3 scripts/audit_checkout_release.py
      - name: Test pre-launch economic invariants
        run: npm run test:prelaunch
      - name: Compile functions
        run: npm run build:functions
      - name: Build production browser bundles
        run: npm run build:web
      - name: Restore staged source after bundle smoke build
        run: git restore --worktree .
      - name: Re-run permanent audit
        run: python3 scripts/audit_presale_public.py
      - name: Commit tested reconnect hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "[wallet-reconnect] prevent duplicate Wallet Standard reconnect prompts"
          git push origin HEAD:build/presale-stability-wallet-2026-08-16
