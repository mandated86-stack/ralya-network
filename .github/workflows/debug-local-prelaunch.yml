name: Debug Local Prelaunch Assertion
on:
  push:
    branches: [agent/prelaunch-presale]
    paths: ['.github/workflows/debug-local-prelaunch.yml']
permissions:
  contents: read
jobs:
  map-line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 66e90367a7b3d977051caf4dbc74e98a73402c07
      - name: Print failed harness lines around assertion
        shell: bash
        run: |
          echo 'Mapping failed integration commit harness lines 135-150'
          sed -n "/cat > \/tmp\/ralya_local_integration\.mjs <<'JS'/,/^JS$/p" scripts/local_validator_smoke.sh \
            | sed '1d;$d' \
            | nl -ba \
            | sed -n '135,150p'
