name: Debug Local Prelaunch Assertion
on:
  push:
    branches: [agent/prelaunch-presale]
    paths: ['.github/workflows/debug-local-prelaunch.yml']
permissions:
  contents: read
jobs:
  map-line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print full generated localhost harness with line numbers
        shell: bash
        run: |
          echo 'Mapping entire generated localhost integration harness'
          sed -n "/cat > \/tmp\/ralya_local_integration\.mjs <<'JS'/,/^JS$/p" scripts/local_validator_smoke.sh \
            | sed '1d;$d' \
            | nl -ba
