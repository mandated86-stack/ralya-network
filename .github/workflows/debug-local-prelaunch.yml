name: Debug Local Prelaunch Assertion
on:
  push:
    branches: [agent/prelaunch-presale]
    paths: ['.github/workflows/debug-local-prelaunch.yml']
permissions:
  contents: read
jobs:
  map-line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print generated localhost harness lines around failing assertion
        shell: bash
        run: |
          echo 'Mapping generated test lines 132-150'
          awk '/^cat > \/tmp\/ralya_local_integration\.mjs <<.NODE./{on=1;next} /^NODE$/{if(on){exit}} on{print}' scripts/local_validator_smoke.sh \
            | nl -ba \
            | sed -n '132,150p'
