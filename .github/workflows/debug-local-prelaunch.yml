name: Debug Local Prelaunch Reconciliation
on:
  push:
    branches: [agent/prelaunch-presale]
    paths: ['.github/workflows/debug-local-prelaunch.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prelaunch-presale

      - name: Apply final financial hardening patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              if old not in s:
                  if new in s:
                      return
                  raise SystemExit(f'{label}: expected source text not found in {path}')
              p.write_text(s.replace(old,new,1))

          # 1) Keep Anchor delivery account parsing comfortably below Solana's stack limit.
          p=Path('programs/rlya_sale/src/lib.rs'); s=p.read_text()
          for struct_name in ('DeliverPrelaunch', 'DeliverPrelaunchManual'):
              marker=f"pub struct {struct_name}<'info> {{"
              start=s.index(marker)
              end=s.find('\n}\n\n#[derive(Accounts)]', start)
              if end < 0: raise SystemExit(f'could not isolate {struct_name}')
              end += 2
              block=s[start:end]
              block=block.replace("pub sale: Account<'info, Sale>,", "pub sale: Box<Account<'info, Sale>>,")
              block=block.replace("pub prelaunch_metrics: Account<'info, PrelaunchMetrics>,", "pub prelaunch_metrics: Box<Account<'info, PrelaunchMetrics>>,")
              s=s[:start]+block+s[end:]
          p.write_text(s)

          # 2) Make the standalone localhost harness resolve dependencies from /tmp itself,
          #    and remove the duplicate final mint variable from the extended test.
          p=Path('scripts/local_validator_smoke.sh'); s=p.read_text()
          s=s.replace(
              'npm install --no-save --no-package-lock --silent @solana/web3.js@1.98.4 @solana/spl-token@0.4.14',
              'npm install --prefix /tmp --no-save --no-package-lock --silent @solana/web3.js@1.98.4 @solana/spl-token@0.4.14'
          )
          old="const mint=await getMint(c,rlya);assert.equal(mint.supply,HARD);assert.equal(mint.mintAuthority,null);assert.equal(mint.freezeAuthority,null);"
          if 'const finalMint=await getMint(c,rlya)' not in s:
              before, sep, tail=s.rpartition(old)
              if not sep: raise SystemExit('final duplicate mint assertion not found')
              new="const finalMint=await getMint(c,rlya);assert.equal(finalMint.supply,HARD);assert.equal(finalMint.mintAuthority,null);assert.equal(finalMint.freezeAuthority,null);"
              s=before+new+tail
          p.write_text(s)

          # 3) Reservations must affect the live quote price/preview, while confirmed totals
          #    remain separately visible.
          replace_once(
              'netlify/functions/_shared/presale-core.mts',
              "  const current = priceAt(totalAllocated);\n  const nextBoundary = minBig(((totalAllocated / STEP_SIZE_BASE) + 1n) * STEP_SIZE_BASE, PRESALE_CAP_BASE);",
              "  const current = priceAt(effectiveProgress);\n  const nextBoundary = minBig(((effectiveProgress / STEP_SIZE_BASE) + 1n) * STEP_SIZE_BASE, PRESALE_CAP_BASE);",
              'reservation-aware live price'
          )
          replace_once(
              'netlify/functions/_shared/presale-core.mts',
              "    toNextStepBase: nextBoundary > totalAllocated ? nextBoundary - totalAllocated : 0n,",
              "    toNextStepBase: nextBoundary > effectiveProgress ? nextBoundary - effectiveProgress : 0n,",
              'reservation-aware next step'
          )
          replace_once(
              'netlify/functions/_shared/presale-core.mts',
              "    totalAllocatedBase: state.totalAllocatedBase.toString(),\n    webAllocatedBase:",
              "    totalAllocatedBase: state.totalAllocatedBase.toString(),\n    quoteProgressBase: state.effectiveProgressBase.toString(),\n    webAllocatedBase:",
              'public quote progress'
          )

          # 4) Owner replay protection is claimed atomically with Netlify Blobs onlyIfNew.
          replace_once(
              'netlify/functions/_shared/presale-core.mts',
              "  const used = await s.get(`auth/${nonce}`, { type: 'json' });\n  if (used) throw new Error('Owner action nonce has already been used.');\n  let signature: Buffer;",
              "  let signature: Buffer;",
              'remove non-atomic owner nonce read'
          )
          replace_once(
              'netlify/functions/_shared/presale-core.mts',
              "  if (!ok) throw new Error('Owner signature verification failed.');\n  await s.setJSON(`auth/${nonce}`, { operation, usedAt: new Date().toISOString() });\n  return { wallet, operation, payload };",
              "  if (!ok) throw new Error('Owner signature verification failed.');\n  const nonceClaim = await s.setJSON(`auth/${nonce}`, { operation, usedAt: new Date().toISOString() }, { onlyIfNew: true });\n  if (!nonceClaim.modified) throw new Error('Owner action nonce has already been used.');\n  return { wallet, operation, payload };",
              'atomic owner nonce claim'
          )

          # 5) Replace the timing-based mutation lock with atomic conditional writes.
          p=Path('netlify/functions/_shared/presale-core.mts'); s=p.read_text()
          old="""const sleep = (ms: number) => new Promise(resolve => setTimeout(resolve, ms));

export async function withMutationLock<T>(s: ReturnType<typeof store>, fn: () => Promise<T>): Promise<T> {
  const token = randomUUID();
  const key = 'lock/mutation';
  let acquired = false;
  for (let attempt = 0; attempt < 12 && !acquired; attempt += 1) {
    const now = Date.now();
    const current: any = await s.get(key, { type: 'json' });
    if (current?.expiresAtMs && Number(current.expiresAtMs) > now) {
      await sleep(70 + Math.floor(Math.random() * 90));
      continue;
    }
    await s.setJSON(key, { token, expiresAtMs: now + 8_000 });
    await sleep(90 + Math.floor(Math.random() * 50));
    const check1: any = await s.get(key, { type: 'json' });
    if (check1?.token !== token) continue;
    await sleep(45);
    const check2: any = await s.get(key, { type: 'json' });
    if (check2?.token === token) acquired = true;
  }
  if (!acquired) throw new Error('Presale is busy. Please retry in a moment.');
  try {
    return await fn();
  } finally {
    const current: any = await s.get(key, { type: 'json' });
    if (current?.token === token) await s.delete(key);
  }
}
"""
          new="""const sleep = (ms: number) => new Promise(resolve => setTimeout(resolve, ms));
const MUTATION_LOCK_LEASE_MS = 120_000;

export async function withMutationLock<T>(s: ReturnType<typeof store>, fn: () => Promise<T>): Promise<T> {
  const token = randomUUID();
  const key = 'lock/mutation';
  let acquired = false;
  for (let attempt = 0; attempt < 20 && !acquired; attempt += 1) {
    const now = Date.now();
    const current: any = await s.getWithMetadata(key, { type: 'json' });
    let result: any = null;
    if (!current) {
      result = await s.setJSON(key, { token, expiresAtMs: now + MUTATION_LOCK_LEASE_MS }, { onlyIfNew: true });
    } else if (Number(current.data?.expiresAtMs || 0) <= now) {
      result = await s.setJSON(key, { token, expiresAtMs: now + MUTATION_LOCK_LEASE_MS }, { onlyIfMatch: current.etag });
    }
    if (result?.modified) {
      acquired = true;
      break;
    }
    await sleep(90 + Math.floor(Math.random() * 110));
  }
  if (!acquired) throw new Error('Presale is busy. Please retry in a moment.');
  try {
    return await fn();
  } finally {
    const current: any = await s.getWithMetadata(key, { type: 'json' });
    if (current?.data?.token === token) await s.delete(key);
  }
}
