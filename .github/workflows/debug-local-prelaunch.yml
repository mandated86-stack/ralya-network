name: Debug Local Prelaunch Reconciliation
on:
  push:
    branches: [agent/prelaunch-presale]
    paths: ['.github/workflows/debug-local-prelaunch.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prelaunch-presale
      - name: Apply final financial hardening patches
        run: python3 scripts/_tmp_finalize_prelaunch_release.py
      - name: Run deterministic prelaunch release checks
        run: |
          python3 scripts/audit_prelaunch.py
          node --check web/prelaunch.js
          node --check web/owner/presale-control.js
          npm install --no-audit --no-fund
          npm run test:prelaunch
          npm run build:functions
      - name: Full localhost protocol integration
        run: bash scripts/local_validator_smoke.sh
      - name: Commit validated production fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs/rlya_sale/src/lib.rs scripts/local_validator_smoke.sh scripts/audit_prelaunch.py netlify/functions/_shared/presale-core.mts netlify/functions/presale-quote.mts netlify/functions/presale-state.mts netlify/functions/presale-wallet.mts web/prelaunch.js
          if git diff --cached --quiet; then
            echo 'No validated production changes needed.'
            exit 0
          fi
          git commit -m 'Harden prelaunch allocation concurrency and privacy'
          git push origin HEAD:agent/prelaunch-presale
