name: Debug Local Prelaunch Reconciliation
on:
  push:
    branches: [agent/prelaunch-presale]
    paths: ['.github/workflows/debug-local-prelaunch.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prelaunch-presale
      - name: Reduce delivery account stack frames
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('programs/rlya_sale/src/lib.rs')
          s=p.read_text()
          for struct_name in ('DeliverPrelaunch', 'DeliverPrelaunchManual'):
              marker=f"pub struct {struct_name}<'info> {{"
              start=s.index(marker)
              next_derive=s.find('\n}\n\n#[derive(Accounts)]', start)
              if next_derive < 0:
                  raise SystemExit(f'could not isolate {struct_name}')
              end=next_derive + 2
              block=s[start:end]
              block2=block.replace("pub sale: Account<'info, Sale>,", "pub sale: Box<Account<'info, Sale>>,")
              block2=block2.replace("pub prelaunch_metrics: Account<'info, PrelaunchMetrics>,", "pub prelaunch_metrics: Box<Account<'info, PrelaunchMetrics>>,")
              if block2 == block and 'Box<Account' not in block:
                  raise SystemExit(f'expected account fields not found in {struct_name}')
              s=s[:start]+block2+s[end:]
          p.write_text(s)
          PY
          grep -A45 "pub struct DeliverPrelaunch<'info>" programs/rlya_sale/src/lib.rs | grep 'Box<Account' | wc -l | grep '^2$'
          grep -A45 "pub struct DeliverPrelaunchManual<'info>" programs/rlya_sale/src/lib.rs | grep 'Box<Account' | wc -l | grep '^2$'
      - name: Prelaunch audit
        run: python3 scripts/audit_prelaunch.py
      - name: Full localhost protocol integration
        run: bash scripts/local_validator_smoke.sh
      - name: Commit validated stack fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs/rlya_sale/src/lib.rs
          if git diff --cached --quiet; then
            echo 'No stack-fix change needed.'
            exit 0
          fi
          git commit -m 'Reduce prelaunch delivery stack frames'
          git push origin HEAD:agent/prelaunch-presale
