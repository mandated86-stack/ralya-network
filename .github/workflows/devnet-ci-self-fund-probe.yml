name: Devnet CI Self Fund Probe
on:
  push:
    paths:
      - '.github/workflows/devnet-ci-self-fund-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install web3
        run: npm install --prefix /tmp --no-save --no-package-lock --silent @solana/web3.js@1.98.4
      - name: Request Devnet SOL from provider RPC
        run: |
          cat > /tmp/probe.mjs <<'JS'
          import {Connection,Keypair,LAMPORTS_PER_SOL} from '@solana/web3.js';
          const rpc='https://docs-demo.solana-devnet.quiknode.pro/';
          const c=new Connection(rpc,'finalized');
          const k=Keypair.generate();
          console.log('CI_TEST_ADDRESS='+k.publicKey.toBase58());
          const sig=await c.requestAirdrop(k.publicKey,LAMPORTS_PER_SOL);
          console.log('AIRDROP_SIGNATURE='+sig);
          for(let i=0;i<60;i++){
            const b=await c.getBalance(k.publicKey,'finalized');
            if(b>=0.5*LAMPORTS_PER_SOL){console.log('CI_SELF_FUNDING=PASS balance='+b);process.exit(0)}
            await new Promise(r=>setTimeout(r,1000));
          }
          throw new Error('provider airdrop not finalized');
          JS
          node /tmp/probe.mjs
