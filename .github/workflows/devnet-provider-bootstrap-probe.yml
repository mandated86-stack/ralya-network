name: Devnet Provider Bootstrap Probe
on:
  push:
    paths:
      - '.github/workflows/devnet-provider-bootstrap-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install web3
        run: npm install --prefix /tmp --no-save --no-package-lock --silent @solana/web3.js@1.98.4
      - name: Probe provider-side Devnet funding
        run: |
          cat > /tmp/probe.mjs <<'JS'
          import {Connection,Keypair,LAMPORTS_PER_SOL} from '@solana/web3.js';
          const candidates=[
            ['TRITON','https://api.devnet.rpcpool.com/'],
            ['HELIUS_DEMO','https://demo.helius.dev/api/rpc?network=devnet']
          ];
          for(const [name,rpc] of candidates){
            const k=Keypair.generate();
            console.log(name+'_ADDRESS='+k.publicKey.toBase58());
            try{
              const c=new Connection(rpc,'confirmed');
              const sig=await c.requestAirdrop(k.publicKey,LAMPORTS_PER_SOL);
              console.log(name+'_SIG='+sig);
              for(let i=0;i<45;i++){
                const b=await c.getBalance(k.publicKey,'confirmed');
                if(b>=0.5*LAMPORTS_PER_SOL){console.log(name+'_BOOTSTRAP=PASS balance='+b);process.exit(0)}
                await new Promise(r=>setTimeout(r,1000));
              }
            }catch(e){console.log(name+'_FAIL='+e.message)}
          }
          throw new Error('No provider bootstrap succeeded');
          JS
          node /tmp/probe.mjs
