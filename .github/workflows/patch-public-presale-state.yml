name: Patch public presale state
on:
  workflow_dispatch:
  push:
    branches:
      - fix/public-state-force-open-2026-08-16
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make public state honor force-open
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('netlify/functions/presale-state.mts')
          s = p.read_text(encoding='utf-8')

          anchor = "const QUOTE_CONFIRMATION_GRACE_MS = 2 * 60 * 1000;\n"
          insert = """const QUOTE_CONFIRMATION_GRACE_MS = 2 * 60 * 1000;\n\nfunction forcePresaleOpen() {\n  const value = (globalThis as any).Netlify?.env?.get?.('RALYA_PRESALE_FORCE_OPEN');\n  return /^(1|true|yes|on)$/i.test(String(value || '').trim());\n}\n"""
          if anchor not in s:
              raise SystemExit('state constant anchor not found')
          s = s.replace(anchor, insert, 1)

          old_control = """    const control = controlRaw && ['closed', 'open', 'paused'].includes(String(controlRaw.access))\n      ? controlRaw\n      : { access: 'closed', updatedAt: null };"""
          new_control = """    const storedControl = controlRaw && ['closed', 'open', 'paused'].includes(String(controlRaw.access))\n      ? controlRaw\n      : { access: 'open', updatedAt: null };\n    const control = forcePresaleOpen() && storedControl.access === 'closed'\n      ? { ...storedControl, access: 'open' }\n      : storedControl;"""
          if old_control not in s:
              raise SystemExit('state control block not found')
          s = s.replace(old_control, new_control, 1)

          old_access = "      access: String(control.access || 'closed'),"
          new_access = "      access: String(control.access || 'open'),"
          if old_access not in s:
              raise SystemExit('state access default not found')
          s = s.replace(old_access, new_access, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit public state fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/presale-state.mts
          git diff --cached --check
          git commit -m 'Make public presale state stay open'
          git push
