[build]
  command = "npm run build:web"
  publish = "web"

[[redirects]]
  from = "https://ralya-network.netlify.app/*"
  to = "https://ralyaai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://main--ralya-network.netlify.app/*"
  to = "https://ralyaai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/rlya-token.png"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/rlya-token.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/token-metadata.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/site-copy.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
